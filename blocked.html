<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not the feed</title>
<style>
  :root { --bg:#17161f; --card:#221f2e; --text:#f3f0fa; --muted:#b5aec8; --green:#7fd36a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--text); font:17px/1.5 system-ui, "Segoe UI", sans-serif; padding:12px 16px; }
  main { max-width:520px; text-align:center; }
  img { width:216px; max-width:63vw; height:auto; }
  .bubble { background:var(--card); border:2px solid #3a3550; border-radius:18px; padding:12px 22px; margin:4px 0 14px; position:relative; }
  .bubble::before { content:""; position:absolute; top:-12px; left:50%; margin-left:-10px;
         border:10px solid transparent; border-bottom-color:#3a3550; border-top:0; }
  h1 { font-size:1.6rem; margin:0 0 6px; }
  p { margin:6px 0; color:var(--muted); }
  .breathe { width:72px; height:72px; margin:10px auto 4px; border-radius:50%; background:var(--green);
         opacity:.85; animation:breathe 10s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform:scale(.55); } 50% { transform:scale(1); } }
  #cue { font-weight:600; color:var(--text); min-height:1.5em; }
  small { display:block; margin-top:12px; color:#7d7690; }
</style>
</head>
<body>
<main>
  <img id="pic" src="alien.svg" alt="A grumpy green alien bouncer with crossed arms">
  <div class="bubble">
    <h1>Nope.</h1>
    <p id="why">You decided Reddit is bad for you.</p>
  </div>
  <p>Take a few slow breaths with the circle, or go drink a glass of water.</p>
  <div class="breathe" aria-hidden="true"></div>
  <div id="cue">Breathe in</div>
  <small>Subreddits and posts you go to on purpose still open.</small>
</main>
<script src="cue.js"></script>
</body>
</html>
